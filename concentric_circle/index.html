<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Concentric Circles</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f5f5f5;
        }

        .circle {
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer circle - Radius = 30px */
        .circle1 {
            width: 60px;
            height: 60px;
            background-color: red;
        }

        /* Middle circle - Radius = 20px */
        .circle2 {
            width: 40px;
            height: 40px;
            background-color: blue;
        }

        /* Inner circle - Radius = 10px */
        .circle3 {
            width: 20px;
            height: 20px;
            background-color: green;
        }
    </style>
</head>

<body>

    <div class="circle circle1">
        <div class="circle circle2">
            <div class="circle circle3"></div>
        </div>
    </div>

</body>

</html>
